name: ExpenseSplit Android

# Scoped to this app's directory so it stays out of the way of the other
# projects in this repository.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['expense-split-android/**', '.github/workflows/expense-split-android.yml']
  pull_request:
    paths: ['expense-split-android/**', '.github/workflows/expense-split-android.yml']
  workflow_dispatch:

concurrency:
  group: expense-split-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: expense-split-android

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner ships an Android SDK; this only fills in anything missing.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # Runs first so a logic regression fails fast, before the slower Android build.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expensesplit-debug-apk
          path: expense-split-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Uploaded even when an earlier step fails — that is exactly when they are needed.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expensesplit-reports
          path: |
            expense-split-android/app/build/reports/tests/
            expense-split-android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
