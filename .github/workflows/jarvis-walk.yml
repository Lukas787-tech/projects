name: Mochi tap walk

# Taps every button on every screen of the app on a real Android system image
# (an emulator) and fails if any tap crashes the app or throws the person out
# of it. Triggered by "[walk]" in a commit message, or by hand.
on:
  push:
    paths:
      - 'jarvis-android/**'
      - '.github/workflows/jarvis-walk.yml'
      - '.github/scripts/device-walk.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[walk]')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    defaults:
      run:
        working-directory: jarvis-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -eu
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug app
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tap everything on the emulator
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: jarvis-android
          script: python3 ../.github/scripts/device-walk.py ../docs/device-walk

      - name: Upload the walk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochi-tap-walk
          path: docs/device-walk/
          if-no-files-found: warn
          retention-days: 30
