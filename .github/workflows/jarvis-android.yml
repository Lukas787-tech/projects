name: Build Jarvis APK

on:
  push:
    paths:
      - 'jarvis-android/**'
      - '.github/workflows/jarvis-android.yml'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Also publish the APK as a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK. setup-android@v3 is not
      # used because it still tries to install the long-removed 'tools' package
      # and fails. Driving sdkmanager directly is both simpler and faster.
      - name: Prepare Android SDK
        run: |
          set -eu
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/jarvis-${GITHUB_SHA::7}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis-android/out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-v${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          body: |
            Install this APK directly on your phone.
            Built from commit ${{ github.sha }}.
          files: jarvis-android/out/*.apk
