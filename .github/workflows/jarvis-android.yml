name: Build Jarvis APK

on:
  push:
    paths:
      - 'jarvis-android/**'
      - '.github/workflows/jarvis-android.yml'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Also publish the APK as a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK. setup-android@v3 is not
      # used because it still tries to install the long-removed 'tools' package
      # and fails. Driving sdkmanager directly is both simpler and faster.
      - name: Prepare Android SDK
        run: |
          set -eu
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The log is kept so the next step can pull the compiler's own lines out
      # of it. A Kotlin failure prints its errors thousands of stack frames
      # before the end of the log, which is the one part nobody scrolls to.
      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon 2>&1 | tee build.log

      - name: What failed
        if: failure()
        run: |
          echo "--- Kotlin and resource errors ---"
          grep -E "^(e: |error: |ERROR:)|FAILURE: |What went wrong|FAILED$|AssertionError|expected:<" build.log | head -n 80 \
            || echo "No compiler error lines in the log; see the step above."

      - name: Stage APK
        run: |
          mkdir -p out
          # Fixed name so the release download URL is stable build to build.
          cp app/build/outputs/apk/release/app-release.apk out/jarvis.apk
          # The same numbers the build gave itself from the run number.
          echo "APP_VERSION=5.5.${GITHUB_RUN_NUMBER} (build $((23 + GITHUB_RUN_NUMBER)))" >> "$GITHUB_ENV"
          echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis-android/out/jarvis.apk
          if-no-files-found: error
          retention-days: 90

      # Published to one fixed tag that is moved each time, so there is a single
      # permanent download link. Numbered tags all shared a creation timestamp,
      # which left the Releases page ordering them arbitrarily and the newest
      # build buried among older ones.
      #
      # The upload is retried because it is the one step here that depends on
      # GitHub's upload endpoint being healthy, and it replaces the asset by
      # deleting the old one first: when the upload then times out, as it did on
      # run 32, the permanent link is left pointing at nothing. A failed publish
      # must not be the end of the attempt.
      - name: Publish release
        id: publish
        if: github.event_name == 'workflow_dispatch' && inputs.make_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          target_commitish: ${{ github.sha }}
          name: Jarvis (latest build)
          make_latest: true
          body: |
            Always the newest Jarvis build — this link never changes.

            Open it on your phone, tap the `.apk`, allow "install unknown apps".
            Then check Settings shows the version below; if it does not, the
            install did not replace the old one.

            Version: ${{ env.APP_VERSION }}
            Built: ${{ env.BUILT_AT }}
            Commit: ${{ github.sha }}
          files: jarvis-android/out/jarvis.apk

      - name: Publish release (second attempt)
        id: publish_retry
        if: |
          github.event_name == 'workflow_dispatch' && inputs.make_release &&
          steps.publish.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          target_commitish: ${{ github.sha }}
          name: Jarvis (latest build)
          make_latest: true
          body: |
            Always the newest Jarvis build — this link never changes.

            Open it on your phone, tap the `.apk`, allow "install unknown apps".
            Then check Settings shows the version below; if it does not, the
            install did not replace the old one.

            Version: ${{ env.APP_VERSION }}
            Built: ${{ env.BUILT_AT }}
            Commit: ${{ github.sha }}
          files: jarvis-android/out/jarvis.apk

      # Neither attempt is trusted on its own word: the job passes only if the
      # link a person will actually tap serves the file.
      - name: Verify the download link
        if: github.event_name == 'workflow_dispatch' && inputs.make_release
        run: |
          set -eu
          URL=https://github.com/${{ github.repository }}/releases/download/jarvis-latest/jarvis.apk
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -sSL -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            echo "attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "The download link serves the APK."
              exit 0
            fi
            sleep 20
          done
          echo "::error::jarvis-latest has no downloadable jarvis.apk. The release"
          echo "::error::asset was deleted but not replaced; re-run this workflow."
          exit 1
