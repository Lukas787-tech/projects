name: Jarvis free LLM probe

# Temporary: asks each keyless chat endpoint one plain question and one that
# needs a tool, from a runner with open network access, so the app only relies
# on endpoints that answer today. Removed again once it has answered.

on:
  push:
    paths:
      - '.github/workflows/jarvis-free-llm-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) Jarvis/5.0'
          PLAIN='{"model":"MODEL","messages":[{"role":"system","content":"You are terse."},{"role":"user","content":"Say the word ready and nothing else."}],"temperature":0.3,"max_tokens":20}'
          TOOLS='{"model":"MODEL","messages":[{"role":"user","content":"What is the weather in Paris right now? Use the tool."}],"tools":[{"type":"function","function":{"name":"weather","description":"Current weather for a place","parameters":{"type":"object","properties":{"place":{"type":"string"}},"required":["place"]}}}],"tool_choice":"auto","max_tokens":200}'

          probe() {
            local name="$1" url="$2" model="$3" extra="$4"
            for kind in plain tools; do
              if [ "$kind" = plain ]; then body="${PLAIN/MODEL/$model}"; else body="${TOOLS/MODEL/$model}"; fi
              start=$(date +%s%3N)
              out=$(curl -sS -m 60 -A "$UA" -H 'Content-Type: application/json' $extra -w '\nHTTP %{http_code}' -d "$body" "$url" 2>&1)
              end=$(date +%s%3N)
              echo "=== $name [$model] $kind ($((end-start)) ms)"
              echo "$out" | head -c 900
              echo
            done
          }

          echo "############ model lists"
          for u in https://text.pollinations.ai/models https://api.llm7.io/v1/models https://gen.pollinations.ai/v1/models https://ai.hackclub.com/model https://api.airforce/v1/models; do
            echo "=== GET $u"
            curl -sS -m 30 -A "$UA" -w '\nHTTP %{http_code}' "$u" | head -c 2500
            echo
          done

          echo "############ chat"
          probe pollinations-openai https://text.pollinations.ai/openai openai ""
          probe pollinations-openai-fast https://text.pollinations.ai/openai openai-fast ""
          probe pollinations-mistral https://text.pollinations.ai/openai mistral ""
          probe pollinations-gen https://gen.pollinations.ai/v1/chat/completions openai ""
          probe llm7-default https://api.llm7.io/v1/chat/completions default ""
          probe llm7-fast https://api.llm7.io/v1/chat/completions fast ""
          probe llm7-nano https://api.llm7.io/v1/chat/completions gpt-4.1-nano-2025-04-14 ""
          probe hackclub https://ai.hackclub.com/chat/completions "" ""
          probe airforce https://api.airforce/v1/chat/completions gpt-4o-mini ""

          echo "############ simple GET endpoints"
          echo "=== pollinations GET"
          curl -sS -m 40 -A "$UA" -w '\nHTTP %{http_code}' 'https://text.pollinations.ai/Say%20ready%20and%20nothing%20else' | head -c 400; echo
          echo "=== apifreellm"
          curl -sS -m 40 -A "$UA" -H 'Content-Type: application/json' -w '\nHTTP %{http_code}' -d '{"message":"Say ready and nothing else."}' https://apifreellm.com/api/chat | head -c 400; echo
          echo "=== mlvoca"
          curl -sS -m 60 -A "$UA" -H 'Content-Type: application/json' -w '\nHTTP %{http_code}' -d '{"model":"tinyllama","prompt":"Say ready.","stream":false}' https://mlvoca.com/api/generate | head -c 400; echo
          echo "=== duckchat status"
          curl -sS -m 30 -A "$UA" -D - -o /dev/null -H 'x-vqd-accept: 1' https://duckduckgo.com/duckchat/v1/status | head -n 30; echo

          echo "############ other keyless services the app leans on"
          for u in 'https://html.duckduckgo.com/html/?q=weather+berlin' 'https://lite.duckduckgo.com/lite/?q=weather+berlin' 'https://api.duckduckgo.com/?q=berlin&format=json' 'https://en.wikipedia.org/api/rest_v1/page/summary/Berlin' 'https://api.open-meteo.com/v1/forecast?latitude=52.5&longitude=13.4&current=temperature_2m' 'https://api.frankfurter.app/latest?from=EUR&to=USD' 'https://nominatim.openstreetmap.org/search?q=berlin&format=json&limit=1' 'https://router.project-osrm.org/route/v1/foot/13.38,52.51;13.40,52.52?overview=false' 'https://overpass-api.de/api/status' 'https://api.dictionaryapi.dev/api/v2/entries/en/serendipity' 'https://v2.jokeapi.dev/joke/Any?safe-mode' 'https://api.quotable.io/random' 'https://zenquotes.io/api/random' 'https://www.reddit.com/r/worldnews/top.json?limit=3&t=day' 'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en' 'https://feeds.bbci.co.uk/news/world/rss.xml' 'https://hacker-news.firebaseio.com/v0/topstories.json' 'https://api.mymemory.translated.net/get?q=hello%20world&langpair=en|de' 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=de&dt=t&q=hello%20world' 'https://date.nager.at/api/v3/PublicHolidays/2026/DE' 'https://api.sunrise-sunset.org/json?lat=52.5&lng=13.4&formatted=0' 'https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=Arsenal' 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur' 'https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=1d&interval=1d' 'https://stooq.com/q/l/?s=aapl.us&f=sd2t2ohlcv&h&e=csv' 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=52.5&longitude=13.4&current=european_aqi' 'https://geocoding-api.open-meteo.com/v1/search?name=Berlin&count=1' 'https://ipapi.co/json/' 'https://api.tvmaze.com/search/shows?q=office' 'https://openlibrary.org/search.json?q=dune&limit=1' 'https://www.themealdb.com/api/json/v1/1/search.php?s=pasta' 'https://numbersapi.com/42' 'https://uselessfacts.jsph.pl/api/v2/facts/random' 'https://icanhazdadjoke.com/' 'https://api.wolframalpha.com/v1/result?i=2%2B2' 'https://image.pollinations.ai/prompt/a%20red%20apple?width=64&height=64&nologo=true'; do
            code=$(curl -sS -m 30 -A "$UA" -H 'Accept: application/json' -o /tmp/body -w '%{http_code} %{size_download}B %{time_total}s' "$u" 2>&1)
            echo "=== $u -> $code"
            head -c 300 /tmp/body | tr '\n' ' '
            echo
          done
