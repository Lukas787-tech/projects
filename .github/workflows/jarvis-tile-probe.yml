name: Jarvis tile probe
# Temporary diagnostics: which map tile source answers with a placeholder
# ("API Key Required") instead of a real tile. Two different tiles from the
# same source that come back byte-identical are a placeholder, not a map.
on:
  push:
    paths:
      - .github/workflows/jarvis-tile-probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr > /dev/null
      - name: Fetch tiles
        run: |
          UA="JarvisAssistant/1.0 (personal Android assistant; +https://github.com/lukas787-tech/projects)"
          probe() {
            name=$1; url=$2
            code=$(curl -sS -A "$UA" -D "$name.h" -o "$name.img" -w '%{http_code}' "$url" || echo 000)
            type=$(grep -i '^content-type' "$name.h" | tr -d '\r' | cut -d' ' -f2)
            md5=$(md5sum "$name.img" | cut -c1-10)
            size=$(stat -c %s "$name.img")
            text=$(tesseract "$name.img" - 2>/dev/null | tr '\n' ' ' | head -c 80)
            echo "$name | HTTP $code | $type | $size B | md5 $md5 | text: $text"
          }
          probe eox_A        "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/10/335/550.jpg"
          probe eox_B        "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/13/2686/4400.jpg"
          probe eox_z15      "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/15/10745/17602.jpg"
          probe osmde_B      "https://tile.openstreetmap.de/12/2200/1343.png"
          probe osm_z17      "https://tile.openstreetmap.org/17/70410/42985.png"
          echo "--- as Android's OkHttp asks: gzip, HTTP/1.1, no Accept ---"
          okprobe() {
            name=$1; url=$2
            code=$(curl -sS --http1.1 -H 'Accept:' -H 'Accept-Encoding: gzip' -A "$UA" -o "$name.img" -w '%{http_code}' "$url" || echo 000)
            echo "$name | HTTP $code | $(stat -c %s "$name.img") B | md5 $(md5sum "$name.img" | cut -c1-10) | $(tesseract "$name.img" - 2>/dev/null | tr '\n' ' ' | head -c 60)"
          }
          okprobe ok_carto_dark  "https://basemaps.cartocdn.com/dark_all/15/17205/11163@2x.png"
          okprobe ok_carto_voy   "https://basemaps.cartocdn.com/rastertiles/voyager/15/17205/11163@2x.png"
          okprobe ok_esri        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/15/11163/17205"
