name: Jarvis screenshots

# Renders the real app on the JVM (Robolectric) and commits the pictures to
# docs/screens, so the design can be looked at without a phone. It runs only
# for a push whose commit message contains [screens]; everything else about
# the build is the other workflow's job. Its test source set is debug-only,
# so nothing here can break the release APK.
on:
  push:
    paths:
      - 'jarvis-android/**'
      - '.github/workflows/jarvis-screens.yml'

permissions:
  contents: write

jobs:
  screens:
    if: contains(github.event.head_commit.message, '[screens]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jarvis-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -eu
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A hang must not eat the job: the step stops, and whatever was
      # rendered before it is still committed below.
      - name: Render the screens
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --tests 'com.lukas.jarvis.ScreensTest' --no-daemon 2>&1 | tee screens.log

      - name: What failed
        if: failure()
        run: |
          grep -E "^(e: |error: |ERROR:)|FAILURE: |What went wrong|FAILED$|Exception|Caused by" screens.log | head -n 80 || true
          find app/build/test-results -name '*.xml' -exec grep -l "<failure" {} \; | xargs -r sed -n '1,160p'

      - name: Commit the pictures
        if: always()
        run: |
          set -u
          mkdir -p ../docs/screens
          cp app/build/screens/*.png ../docs/screens/ 2>/dev/null || true
          cp app/build/screens/report.txt ../docs/screens/ 2>/dev/null || true
          cp app/build/screens/progress.txt ../docs/screens/ 2>/dev/null || true
          cp app/build/screens/stall-*.txt ../docs/screens/ 2>/dev/null || true
          # A failure before any picture still leaves its reason where it can be read.
          if [ ! -f ../docs/screens/report.txt ] || [ -z "$(ls app/build/screens/*.png 2>/dev/null)" ]; then
            { echo "Run ${GITHUB_RUN_ID}: no pictures."; grep -E "Exception|Caused by|What went wrong|^e: " screens.log | head -n 60; } > ../docs/screens/report.txt || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../docs/screens
          git commit -m "Update Jarvis screenshots" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
