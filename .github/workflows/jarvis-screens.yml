name: Mochi screenshots

# Renders the real app on the JVM (Robolectric) and keeps the pictures as a
# workflow artifact, so the design can be looked at without a phone. It runs
# for a push whose commit message contains [screens], or by hand; everything
# else about the build is the other workflow's job. Its test source set is
# debug-only, so nothing here can break the release APK.
on:
  push:
    paths:
      - 'jarvis-android/**'
      - '.github/workflows/jarvis-screens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screens:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jarvis-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -eu
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A hang must not eat the job: the step stops, and whatever was
      # rendered before it is still committed below.
      - name: Render the screens
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --tests 'com.lukas.jarvis.CafeShotsTest' --tests 'com.lukas.jarvis.CafeLandscapeShotsTest' --tests 'com.lukas.jarvis.ScreensTest' --tests 'com.lukas.jarvis.PlaceAlertTest' --tests 'com.lukas.jarvis.ProfileSwitchTest' --no-daemon 2>&1 | tee screens.log

      - name: What failed
        if: failure()
        run: |
          grep -E "^(e: |error: |ERROR:)|FAILURE: |What went wrong|FAILED$|Exception|Caused by" screens.log | head -n 80 || true
          find app/build/test-results -name '*.xml' -exec grep -l "<failure" {} \; | xargs -r sed -n '1,160p'

      # The pictures are kept with the run, not committed: a redesign means
      # hundreds of renders, and each one used to add a hundred PNGs to the
      # repository's history for good.
      - name: Gather the pictures
        if: always()
        run: |
          mkdir -p out
          cp app/build/screens/*.png out/ 2>/dev/null || true
          cp app/build/screens/*.txt out/ 2>/dev/null || true
          if [ -z "$(ls out/*.png 2>/dev/null)" ]; then
            { echo "Run ${GITHUB_RUN_ID}: no pictures."; grep -E "Exception|Caused by|What went wrong|^e: " screens.log | head -n 60; } > out/report.txt || true
          fi
          ls out | head -n 300

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochi-screens
          path: jarvis-android/out/
          if-no-files-found: warn
          retention-days: 30
