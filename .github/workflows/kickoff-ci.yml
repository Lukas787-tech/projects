name: Kickoff CI

on:
  push:
    branches: [main, "claude/**"]
    paths: ["kickoff/**", ".github/workflows/kickoff-ci.yml"]
  pull_request:
    paths: ["kickoff/**", ".github/workflows/kickoff-ci.yml"]
  workflow_dispatch:

concurrency:
  group: kickoff-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kickoff

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system libraries for Tauri and audio
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev cmake clang libclang-dev

      # whisper.cpp's tiny test model and sample, so the local speech
      # recognition test runs the real pipeline.
      - name: Fetch whisper.cpp test model
        run: |
          mkdir -p "$RUNNER_TEMP/whisper"
          curl -sSfL -o "$RUNNER_TEMP/whisper/model.bin" https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/models/for-tests-ggml-tiny.bin
          curl -sSfL -o "$RUNNER_TEMP/whisper/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          echo "KICKOFF_WHISPER_TEST_MODEL=$RUNNER_TEMP/whisper/model.bin" >> "$GITHUB_ENV"
          echo "KICKOFF_WHISPER_TEST_WAV=$RUNNER_TEMP/whisper/jfk.wav" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kickoff/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kickoff -> target

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: TypeScript bindings are up to date
        run: |
          if [ -n "$(git status --porcelain -- src/bindings)" ]; then
            echo "::error::src/bindings is stale. Run 'cargo test --workspace' in kickoff/ and commit the result."
            git status --porcelain -- src/bindings
            exit 1
          fi

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kickoff/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kickoff -> target

      - run: npm ci

      - name: Fetch whisper.cpp test model
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP whisper
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/models/for-tests-ggml-tiny.bin -OutFile "$dir/model.bin"
          Invoke-WebRequest https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav -OutFile "$dir/jfk.wav"
          "KICKOFF_WHISPER_TEST_MODEL=$dir/model.bin" >> $env:GITHUB_ENV
          "KICKOFF_WHISPER_TEST_WAV=$dir/jfk.wav" >> $env:GITHUB_ENV

      # Includes a real Windows Credential Manager round trip, Windows voices
      # and local Whisper built with MSVC.
      - run: cargo test --workspace

      - name: Build debug installer
        run: npx tauri build --debug --bundles nsis

      - uses: actions/upload-artifact@v6
        with:
          name: kickoff-windows-debug-installer
          path: kickoff/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
