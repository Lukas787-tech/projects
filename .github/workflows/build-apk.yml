name: Build Riverside Hollow APK

on:
  push:
    branches:
      - claude/cozy-android-game-oduvvd
    paths:
      - 'cozy-cabin/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('cozy-cabin/**/*.gradle.kts', 'cozy-cabin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: cozy-cabin
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage APK
        id: stage
        run: |
          mkdir -p out
          APK=$(find cozy-cabin/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Found: $APK"
          cp "$APK" out/RiversideHollow.apk
          ls -la out
          echo "size=$(du -h out/RiversideHollow.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiversideHollow-apk
          path: out/RiversideHollow.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_SIZE: ${{ steps.stage.outputs.size }}
        run: |
          TAG="riverside-hollow-latest"
          {
            echo "Cosy side-view farming game for Android."
            echo ""
            echo "**Install:** download \`RiversideHollow.apk\` below, open it on your phone,"
            echo "and allow installs from your browser or files app when Android asks."
            echo ""
            echo "Requires Android 7.0 (API 24) or newer. APK size: ${APK_SIZE}."
            echo ""
            echo "Built from commit \`${GITHUB_SHA}\`."
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/RiversideHollow.apk \
            --title "Riverside Hollow (latest build)" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
