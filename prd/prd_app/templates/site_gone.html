{% extends "base.html" %}
{% block title %}Site offline — PRD{% endblock %}
{% block content %}
<section class="section"><div class="narrow card center" style="padding:50px 30px">
  <div style="color:#0b0b0b;margin-bottom:6px">{{ icon("eye", 30)|safe }}</div>
  <h1 style="font-size:1.9rem">This site is offline</h1>
  <p class="muted">It was taken down by its creator or by the owner of this PRD instance.</p>
  <a class="btn" href="{{ url_for('views.editor') }}">Build your own</a>
</div></section>
{% endblock %}
