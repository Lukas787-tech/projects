{% extends "base.html" %}
{% block title %}Owner sign-in — PRD{% endblock %}
{% block content %}
<section class="section"><div class="narrow" style="max-width:420px">
  <div class="card">
    <h1 style="font-size:1.6rem">Owner sign-in</h1>
    <p class="muted" style="font-size:.92rem">Only you have this password. It gates the request queue.</p>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autofocus autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
</div></section>
{% endblock %}
