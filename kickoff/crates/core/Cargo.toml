[package]
name = "kickoff-core"
description = "Domain logic for Kickoff: branding, secrets handling, brief, interview, research and kit generation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test doubles (fake providers) for other crates' tests.
testing = []

[dependencies]
async-trait.workspace = true
fastrand.workspace = true
futures.workspace = true
include_dir.workspace = true
jsonschema.workspace = true
minijinja.workspace = true
regex.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
