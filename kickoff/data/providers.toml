[[stt]]
id = "groq_whisper"
display_name = "Groq Whisper (cloud, free tier)"
kind = "openai_transcription"
base_url = "https://api.groq.com/openai/v1"
auth = "bearer"
key_env = "GROQ_API_KEY"
access = "free"
default_model = "whisper-large-v3-turbo"
