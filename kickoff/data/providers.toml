notes = "Shares the Groq key and organization-level limits with the Groq LLM preset."
confidence = "medium"
verified_at = "2026-10-11"

[stt.limits]
rpm = 20
rpd = 2000
audio_seconds_per_day = 28800

# ---------------------------------------------------------------- Text to speech

[[tts]]
id = "fish_audio"
display_name = "Fish Audio"
kind = "fish_audio"
base_url = "https://api.fish.audio"
ws_url = "wss://api.fish.audio/v1/tts/live"
auth = "bearer"
key_env = "FISH_AUDIO_API_KEY"
signup_url = "https://fish.audio/app/api-keys"
docs_url = "https://docs.fish.audio"
access = "free_promo"
# Tried in order. `s2.1-pro-free` was a promotional free model (last reported
# extended to 2026-08-31); the wizard runs a real synthesis to find out whether
# it still works for this key before recommending Fish Audio.
models = ["s2.1-pro-free", "s2.1-pro", "s1"]
# Models usable without paid credits (see docs/PROVIDERS.md).
free_models = ["s2.1-pro-free"]
usage_unit = "utf8_bytes"
# No published numeric cap for the free model (fair use). Users can set their
# own monthly budget in Settings; warnings fire at 80% and 95% of it.
monthly_cap = 0
notes = "Endpoints read from the official fish-audio-python SDK: POST /v1/tts (msgpack, `model` header), WS /v1/tts/live, GET /model, GET /wallet/self/api-credit."
confidence = "high"
verified_at = "2026-10-11"

[[tts]]
id = "piper"
display_name = "Piper (local)"
kind = "piper"
access = "local"
binary_url_windows = "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip"
# Measured from the release asset on 2026-10-12.
binary_sha256_windows = "f3c58906402b24f3a96d92145f58acba6d86c9b5db896d207f78dc80811efcea"
binary_size_windows = 22477236
binary_path_in_archive = "piper/piper.exe"
binary_license = "MIT"
# The revision Piper's own downloader uses; data/piper-voices.json (from the
# rhasspy/piper repo) lists every file there with its size and MD5.
voices_base_url = "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0"
default_voice = "en/en_US/lessac/medium/en_US-lessac-medium"
notes = "Runs as a separate process: `piper --model <voice>.onnx --output_raw`, text on stdin, 16-bit mono PCM out at the voice's sample_rate. Each voice has its own license (MODEL_CARD)."
confidence = "high"
verified_at = "2026-10-11"

[[tts]]
id = "system"
display_name = "Windows voices"
kind = "system"
access = "local"
notes = "Windows.Media.SpeechSynthesis. Zero download; last-resort fallback."
confidence = "high"
verified_at = "2026-10-11"

# ---------------------------------------------------------------- Web search

[[search]]
id = "tavily"
display_name = "Tavily"
kind = "tavily"
endpoint = "https://api.tavily.com/search"
auth = "bearer"
key_env = "TAVILY_API_KEY"
signup_url = "https://app.tavily.com"
docs_url = "https://docs.tavily.com"
access = "free"
card_required = false
monthly_free_units = 1000
unit = "credit"
notes = "1,000 credits/month, no card. Basic search = 1 credit, advanced = 2. Kickoff uses basic."
confidence = "medium"
verified_at = "2026-10-11"

[[search]]
id = "brave"
display_name = "Brave Search"
kind = "brave"
endpoint = "https://api.search.brave.com/res/v1/web/search"
auth = "header:X-Subscription-Token"
key_env = "BRAVE_SEARCH_API_KEY"
signup_url = "https://api-dashboard.search.brave.com"
docs_url = "https://api-dashboard.search.brave.com/app/documentation"
access = "free_credit"
card_required = true
monthly_free_units = 1000
unit = "request"
attribution_required = true
notes = "$5 monthly credit (about 1,000 searches). Card required to subscribe; overages are billed. Attribution required."
confidence = "medium"
verified_at = "2026-10-11"
