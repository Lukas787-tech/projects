# Provider presets for Kickoff.
#
# This file is data, not code: update it when a provider changes its free tier,
# limits or model names. It is bundled with the app and merged with an optional
# user override file (<app data dir>/providers.override.toml), where entries with
# the same `id` replace the bundled ones field by field.
#
# Model names churn constantly. The app always lists models live from each
# provider and uses `model_preference` (glob patterns, best first) to pick one;
# `default_model` is only a fallback when listing fails.
#
# `confidence` records how the entry was verified (see docs/PROVIDERS.md):
#   high   = read from the provider's official docs or official SDK source
#   medium = consistent across several recent secondary sources
#   low    = conflicting or stale sources; treat as a guess until a live test passes
#
# Limits are free-tier limits. Omit a limit when it is unknown: the client then
# relies on 429 handling instead of pre-emptive throttling.

schema_version = 1
updated = "2026-10-11"

[defaults]
# Order the setup wizard tries when recommending a free cloud provider.
# A detected local Ollama with a usable model is recommended ahead of these.
wizard_order = ["gemini", "groq", "openrouter", "mistral"]
# Default fallback chain for every task; users can reorder it in Settings.
fallback_chain = ["gemini", "groq", "openrouter", "ollama"]
search = "tavily"
stt = "whisper_local"
tts = ["fish_audio", "piper", "system"]

# ---------------------------------------------------------------- LLMs

[[llm]]
id = "gemini"
display_name = "Google Gemini"
kind = "openai_compat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
auth = "bearer"
key_env = "GEMINI_API_KEY"
signup_url = "https://aistudio.google.com/apikey"
docs_url = "https://ai.google.dev/gemini-api/docs/openai"
access = "free"
card_required = false
json_mode = "json_schema"
streaming = true
model_list = true
model_preference = ["gemini-3*-flash", "gemini-3*-flash-*", "gemini-2.5-flash", "gemini-*-flash*"]
model_exclude = ["*-lite*", "*image*", "*tts*", "*live*", "*embedding*"]
default_model = "gemini-2.5-flash"
privacy_note = "On the free tier Google may use prompts and responses to improve its products."
notes = "Free tier covers Flash-class models only (Pro models left the free tier in April 2026)."
confidence = "medium"
verified_at = "2026-10-11"

[[llm.limits]]
models = "*"
rpm = 10
rpd = 250

[[llm]]
id = "groq"
display_name = "Groq"
kind = "openai_compat"
base_url = "https://api.groq.com/openai/v1"
auth = "bearer"
key_env = "GROQ_API_KEY"
signup_url = "https://console.groq.com/keys"
docs_url = "https://console.groq.com/docs/rate-limits"
access = "free"
card_required = false
json_mode = "json_object"
streaming = true
model_list = true
model_preference = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen/*", "llama-3.3-70b*"]
model_exclude = ["whisper*", "*guard*", "*tts*"]
default_model = "openai/gpt-oss-120b"
notes = "Reports say Llama models left the free tier on 2026-08-16; gpt-oss models remain free."
confidence = "medium"
verified_at = "2026-10-11"

[[llm.limits]]
models = "openai/gpt-oss-*"
rpm = 30
rpd = 1000
tpm = 8000
tpd = 200000

[[llm.limits]]
models = "*"
rpm = 30
rpd = 1000

[[llm]]
id = "openrouter"
display_name = "OpenRouter (free models)"
kind = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
auth = "bearer"
key_env = "OPENROUTER_API_KEY"
signup_url = "https://openrouter.ai/keys"
docs_url = "https://openrouter.ai/docs/api-reference/limits"
access = "free"
card_required = false
json_mode = "json_object"
streaming = true
model_list = true
# Only models whose id ends in ":free" are offered; the free list changes monthly.
model_filter = "free_only"
model_preference = ["*:free"]
default_model = ""
extra_headers = { "X-Title" = "{app_name}" }
notes = "Daily cap is 50 requests, or 1,000 after a one-time $10 credit purchase."
confidence = "medium"
verified_at = "2026-10-11"

[[llm.limits]]
models = "*"
rpm = 20
rpd = 50

[[llm]]
id = "mistral"
display_name = "Mistral (Experiment plan)"
kind = "openai_compat"
base_url = "https://api.mistral.ai/v1"
auth = "bearer"
key_env = "MISTRAL_API_KEY"
signup_url = "https://console.mistral.ai/api-keys"
docs_url = "https://docs.mistral.ai/getting-started/models/"
access = "free"
card_required = false
json_mode = "json_object"
streaming = true
model_list = true
model_preference = ["mistral-medium-latest", "mistral-small-latest"]
default_model = "mistral-small-latest"
notes = "Free Experiment plan needs phone verification. Per-minute limits are low and not published; check Admin Console -> Limits."
confidence = "low"
verified_at = "2026-10-11"

[[llm]]
id = "cerebras"
display_name = "Cerebras (trial)"
kind = "openai_compat"
base_url = "https://api.cerebras.ai/v1"
auth = "bearer"
key_env = "CEREBRAS_API_KEY"
signup_url = "https://cloud.cerebras.ai/"
docs_url = "https://inference-docs.cerebras.ai/support/rate-limits"
access = "trial"
card_required = true
json_mode = "json_object"
streaming = true
model_list = true
model_preference = ["gpt-oss-120b", "qwen-*", "*"]
default_model = "gpt-oss-120b"
notes = "The always-free tier was replaced by a 30-day trial with one-time credits that requires a card. Not in the default chain."
confidence = "low"
verified_at = "2026-10-11"

[[llm.limits]]
models = "*"
rpm = 5

[[llm]]
id = "ollama"
display_name = "Ollama (local)"
kind = "ollama"
base_url = "http://localhost:11434"
auth = "none"
signup_url = "https://ollama.com/download"
docs_url = "https://github.com/ollama/ollama/blob/main/docs/api.md"
access = "local"
card_required = false
json_mode = "json_schema"
streaming = true
model_list = true
model_preference = ["qwen3*", "gemma3*", "llama3*", "mistral*", "*"]
default_model = ""
notes = "Fully local. Structured output via the `format` field (JSON schema). Models are whatever the user has pulled."
confidence = "high"
verified_at = "2026-10-11"

[[llm]]
id = "anthropic"
display_name = "Anthropic Claude (paid)"
kind = "anthropic"
base_url = "https://api.anthropic.com"
auth = "x_api_key"
key_env = "KICKOFF_ANTHROPIC_KEY"
signup_url = "https://platform.claude.com/settings/keys"
docs_url = "https://docs.claude.com/en/api/messages"
access = "paid"
card_required = true
json_mode = "json_schema"
streaming = true
model_list = true
model_preference = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
default_model = "claude-opus-5-5"
notes = "Optional paid upgrade. anthropic-version 2023-06-01; native structured outputs via output_config.format; temperature is not sent (current models reject it); server-side refusal fallback (fallbacks: \"default\") on Opus/Sonnet 5.5."
confidence = "high"
verified_at = "2026-10-11"

# ---------------------------------------------------------------- Speech to text

[[stt]]
id = "whisper_local"
display_name = "Whisper (local, whisper.cpp)"
kind = "whisper_cpp"
access = "local"
model_url_template = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-{model}.bin"
default_model = "base"
confidence = "high"
verified_at = "2026-10-11"

