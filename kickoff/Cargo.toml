[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform",
    "crates/providers",
    "crates/store",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
kickoff-core = { path = "crates/core" }
kickoff-platform = { path = "crates/platform" }
kickoff-providers = { path = "crates/providers" }
kickoff-store = { path = "crates/store" }

anyhow = "1"
async-trait = "0.1"
directories = "6"
globset = "0.4"
keyring-core = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }
windows-native-keyring-store = "1.1"

[profile.dev.package."*"]
opt-level = 1
