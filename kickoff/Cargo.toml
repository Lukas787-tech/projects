[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform",
    "crates/providers",
    "crates/store",
    "crates/voice",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
kickoff-core = { path = "crates/core" }
kickoff-platform = { path = "crates/platform" }
kickoff-providers = { path = "crates/providers" }
kickoff-store = { path = "crates/store" }
kickoff-voice = { path = "crates/voice" }

anyhow = "1"
async-trait = "0.1"
directories = "6"
fastrand = "2"
futures = "0.3"
base64 = "0.22"
globset = "0.4"
include_dir = "0.7"
jsonschema = { version = "0.58", default-features = false }
keyring-core = "1"
minijinja = "2"
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream", "query", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }
wiremock = "0.6"
windows-native-keyring-store = "1.1"

[profile.dev]
# Line tables keep backtraces readable while keeping build folders small.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
