[package]
name = "kickoff-app"
description = "Kickoff desktop app shell (Tauri)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# matters on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "kickoff_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[features]
default = ["local-whisper"]
# Local speech recognition (whisper.cpp). Needs CMake and Clang to build;
# build with `--no-default-features` to leave it out.
local-whisper = ["kickoff-voice/local-whisper"]

[dependencies]
kickoff-core.workspace = true
kickoff-platform.workspace = true
kickoff-providers.workspace = true
kickoff-store.workspace = true
kickoff-voice.workspace = true
anyhow.workspace = true
reqwest.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
kickoff-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
wiremock.workspace = true
